name: Astro360 validation and audit (no deployment)
on:
  push:
    branches: [feature/astro-360-horizon]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Initialize external audit paths
        run: |
          echo "ASTRO_AUDIT_EVIDENCE=$RUNNER_TEMP/astro-evidence" >> "$GITHUB_ENV"
          echo "ASTRO_AUDIT_OUTPUT=$RUNNER_TEMP/astro-output" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run audit:validate
      - name: Execute pinned NINA Standard parser reference
        shell: pwsh
        run: ./scripts/probe-nina-standard-parser.ps1 -OutputDirectory $env:ASTRO_AUDIT_EVIDENCE
      - name: Package and independently verify current public audit
        if: always()
        run: npm run audit:package
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ASTRO360_CODEX_AUDIT_${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ env.ASTRO_AUDIT_OUTPUT }}/*
          if-no-files-found: error
          retention-days: 90
